services:
  - type: web
    name: nirdosh-vault-api
    runtime: docker
    dockerfilePath: ./NirdoshVault-main/api/Dockerfile
    dockerContext: ./NirdoshVault-main/api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PADDLE_WARMUP_ON_START
        value: "false"
      - key: PREPROCESS_MAX_EDGE
        value: "1500"
      - key: PREPROCESS_JPEG_QUALITY
        value: "78"
      - key: PDF_MAX_PAGES
        value: "3"
      - key: GEMINI_TIMEOUT_MS
        value: "45000"